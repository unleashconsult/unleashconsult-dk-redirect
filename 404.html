<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unleash Consult has moved to unleashconsult.io</title>
<!-- unleashconsult.dk now only forwards visitors to unleashconsult.io.
     The script keeps the path, so an old link such as /logjam/support/
     lands on the same page at the new address. The meta refresh is the
     fallback for browsers without JavaScript. -->
<script>
  location.replace('https://unleashconsult.io' + location.pathname + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://unleashconsult.io/">
<link rel="canonical" href="https://unleashconsult.io/">
</head>
<body>
<p>Unleash Consult has moved to <a href="https://unleashconsult.io/">unleashconsult.io</a>.</p>
</body>
</html>
